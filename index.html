<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alquimia do Tempo - Deep Mind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="side-bar">
      <a href="https://alexxanorafa.github.io/ecosystem/" class="clock-link">
        <svg class="clock-svg" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" class="face"/>
          <line id="h-left" x1="50" y1="50" x2="50" y2="30" class="hand hour"/>
          <line id="m-left" x1="50" y1="50" x2="50" y2="20" class="hand min"/>
          <circle cx="50" cy="50" r="2" class="pivot"/>
        </svg>
      </a>
    </aside>

    <main class="content-panel">
      <h1 class="logo">Alquimia do Tempo</h1>
      
      <div class="time-controls">
        <input type="time" id="time-travel" title="Consultar outra frequência">
      </div>

      <div id="digital-clock" class="digital">00:00:00</div>
      <div id="vibration-tag" class="vibration-badge">Sincronizando...</div>

      <section class="poetry-container">
        <p id="poetic-verse">"O tempo é a substância de que sou feito."</p>
        <cite id="author">— Jorge Luis Borges</cite>
      </section>

      <div class="knowledge-grid">
        <div class="card">
          <label>Ciência & Psique</label>
          <p id="science-text">Analisando...</p>
        </div>
        <div class="card">
          <label>Algoritmo Gramatical</label>
          <p id="grammar-text">Sincronizando...</p>
        </div>
        <div class="card full">
          <label>Pedagogia do Instante</label>
          <p id="pedagogy-text">...</p>
        </div>
      </div>
    </main>

    <aside class="side-bar">
      <a href="#" id="reset-clock" class="clock-link">
        <svg class="clock-svg" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" class="face"/>
          <line id="h-right" x1="50" y1="50" x2="50" y2="30" class="hand hour"/>
          <line id="m-right" x1="50" y1="50" x2="50" y2="20" class="hand min"/>
          <circle cx="50" cy="50" r="2" class="pivot"/>
        </svg>
      </a>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
